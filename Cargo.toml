[package]
name = "codeus-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tower = "0.5"
vercel_runtime = { version = "2", features = ["axum"] }

[lib]
name = "codeus_api"
path = "src/lib.rs"

[[bin]]
name = "codeus_vercel_api"
path = "api/index.rs"
